<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" width="1400" height="760" font-family="Manrope, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Dům S – schéma odpadů</title><rect width="100%" height="100%" fill="#FBF8F2"/><text x="40.0" y="52.0" font-size="26" font-weight="600" fill="#1E211D" text-anchor="start">Dům S – schéma odpadů</text><text x="40.0" y="82.0" font-size="15" font-weight="400" fill="#5A6054" text-anchor="start">Podélný řez pod podlahou. Každý předmět odtéká svisle podlahou, trámy zůstávají celé. Sběrné potrubí vede pod nápravami.</text><text x="40.0" y="690.0" font-size="12" font-weight="400" fill="#5A6054" text-anchor="start">terén ↓ 150 mm pod spodním okrajem řezu</text><rect x="80.0" y="443.9" width="1130.6" height="72.3" rx="2" fill="#e7e9e5" stroke="#b9bdb6" stroke-width="1"/><text x="86.0" y="461.9" font-size="11" font-weight="400" fill="#5A6054" text-anchor="start">rám UPE 160</text><rect x="80.0" y="362.5" width="1130.6" height="81.4" rx="2" fill="#f1e4cf" stroke="#c9b08a" stroke-width="1"/><text x="86.0" y="378.5" font-size="11" font-weight="400" fill="#5A6054" text-anchor="start">podlahová kazeta s izolací</text><rect x="43.5" y="516.3" width="36.5" height="45.2" rx="2" fill="#c4c8c2" stroke="#9aa09a" stroke-width="1"/><rect x="371.8" y="516.3" width="36.5" height="45.2" rx="2" fill="#c4c8c2" stroke="#9aa09a" stroke-width="1"/><text x="390.0" y="579.5" font-size="11" font-weight="400" fill="#5A6054" text-anchor="middle">náprava</text><line x1="1210.6" y1="362.5" x2="1210.6" y2="150.0" stroke="#8C8577" stroke-width="1" stroke-dasharray="4 4" stroke-linecap="round"/><text x="1216.6" y="164.0" font-size="12" font-weight="400" fill="#5A6054" text-anchor="start">štít B</text><line x1="721.9" y1="362.5" x2="721.9" y2="150.0" stroke="#8C8577" stroke-width="1" stroke-dasharray="4 4" stroke-linecap="round"/><text x="715.9" y="164.0" font-size="12" font-weight="400" fill="#5A6054" text-anchor="end">kuchyň</text><text x="727.9" y="164.0" font-size="12" font-weight="400" fill="#5A6054" text-anchor="start">koupelna</text><path d="M233.2,584.1 L1064.7,602.6" stroke="#E3C96A" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M233.2,584.1 L1064.7,602.6" stroke="#6f7477" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M233.2,593.1 L1064.7,611.6" stroke="#d9600d" stroke-width="1.4" fill="none" stroke-dasharray="2 3" stroke-linecap="round" stroke-linejoin="round"/><path d="M233.2,285.7 L233.2,572.8" stroke="#6f7477" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="233.2" cy="285.7" r="6" fill="#fff" stroke="#6f7477" stroke-width="2"/><text x="233.2" y="255.7" font-size="14" font-weight="600" fill="#1E211D" text-anchor="middle">Dřez</text><text x="233.2" y="272.7" font-size="11" font-weight="400" fill="#5A6054" text-anchor="middle">DN40, zápachová uzávěrka</text><path d="M747.4,251.7 L747.4,584.3" stroke="#6f7477" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="747.4" cy="251.7" r="6" fill="#fff" stroke="#6f7477" stroke-width="2"/><text x="747.4" y="221.7" font-size="14" font-weight="600" fill="#1E211D" text-anchor="middle">Umyvadlo</text><text x="747.4" y="238.7" font-size="11" font-weight="400" fill="#5A6054" text-anchor="middle">DN40, zápachová uzávěrka</text><path d="M955.3,344.4 L955.3,588.9" stroke="#6f7477" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="955.3" cy="344.4" r="6" fill="#fff" stroke="#6f7477" stroke-width="2"/><text x="955.3" y="314.4" font-size="14" font-weight="600" fill="#1E211D" text-anchor="middle">Sprcha</text><text x="955.3" y="331.4" font-size="11" font-weight="400" fill="#5A6054" text-anchor="middle">DN50, zápachová uzávěrka</text><path d="M1101.2,258.5 L1101.2,575.5 L1072.0,598.1" stroke="#6f7477" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1089.2" y="245.5" font-size="14" font-weight="600" fill="#1E211D" text-anchor="end">WC DN110</text><path d="M1064.7,602.6 L1119.4,611.7 L1119.4,624.8 L1174.1,624.8" stroke="#6f7477" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="1174.1" y="615.8" width="22.0" height="18.0" rx="3" fill="#fff" stroke="#1E211D" stroke-width="1.4"/><text x="1360.0" y="658.8" font-size="13" font-weight="600" fill="#1E211D" text-anchor="end">hrdlo DN110 → přípojka, jímka nebo ČOV</text><text x="1360.0" y="676.8" font-size="11" font-weight="400" fill="#5A6054" text-anchor="end">hadice na místě, na cestu zaslepené</text><path d="M1101.2,317.3 L1123.1,290.2 L1123.1,140.0" stroke="#6f7477" stroke-width="4" fill="none" stroke-dasharray="8 5" stroke-linecap="round" stroke-linejoin="round"/><path d="M1116.1,148.0 L1123.1,136.0 L1130.1,148.0" stroke="#6f7477" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="1135.1" y="180.0" font-size="12" font-weight="600" fill="#1E211D" text-anchor="start">odvětrání DN50</text><text x="1135.1" y="196.0" font-size="12" font-weight="400" fill="#5A6054" text-anchor="start">nad střechu</text><text x="648.9" y="627.4" font-size="13" font-weight="600" fill="#1E211D" text-anchor="middle">sběrné potrubí DN50, spád 1,8 % (min. 1,5 %), izolace 20 mm a topný kabel s termostatem</text><text x="648.9" y="645.4" font-size="12" font-weight="400" fill="#5A6054" text-anchor="middle">vede pod nápravami: mezi nápravou a příčníky rámu je jen 60 mm</text><line x1="40.0" y1="726.0" x2="74.0" y2="726.0" stroke="#6f7477" stroke-width="6" stroke-linecap="round"/><text x="84.0" y="731.0" font-size="12" font-weight="400" fill="#5A6054" text-anchor="start">odpadní potrubí PP-HT</text><line x1="300.0" y1="726.0" x2="334.0" y2="726.0" stroke="#E3C96A" stroke-width="10" stroke-linecap="round"/><text x="344.0" y="731.0" font-size="12" font-weight="400" fill="#5A6054" text-anchor="start">tepelná izolace</text><line x1="560.0" y1="726.0" x2="594.0" y2="726.0" stroke="#d9600d" stroke-width="2" stroke-linecap="round"/><text x="604.0" y="731.0" font-size="12" font-weight="400" fill="#5A6054" text-anchor="start">topný kabel</text><text x="1360.0" y="731.0" font-size="12" font-weight="400" fill="#5A6054" text-anchor="end">Výšky převýšené 1,2× · rozměry v mm v technickém modelu</text></svg>